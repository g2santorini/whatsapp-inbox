name: Project Manager checks

on:
  push:
    branches:
      - feature/sendro-project-manager
      - feature/workspace-task-hub
      - feature/webflow-ai-backlog-import
      - feature/unified-tabs-whatsapp-live
      - fix/webhook-delivery-hardening-phase1
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'

jobs:
  backend:
    name: Project API and role tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt 'httpx>=0.27' 'pytest>=8.0'
      - run: cd backend && PYTHONPATH=.. python -m pytest tests/test_project_manager.py tests/test_project_route_guard.py tests/test_task_hub.py tests/test_webflow_backlog_import.py tests/test_whatsapp_live_panel.py tests/test_whatsapp_webhook_hardening.py tests/test_manual_index_rollout.py tests/test_instagram_webhook_handshake.py tests/test_instagram_event_normalizer.py tests/test_instagram_encrypted_inbox.py tests/test_instagram_delivery_worker.py tests/test_instagram_worker_control.py tests/test_instagram_inbox_read_api.py tests/test_instagram_synthetic_e2e.py tests/test_instagram_meta_payload_shapes.py tests/test_instagram_queue_reliability.py -q

  frontend:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test src/unifiedInboxRows.test.js
      - run: npm run build

  instagram-postgres-integration:
    name: Instagram isolated PostgreSQL transaction tests
    runs-on: ubuntu-latest
    # The database exists only inside this ephemeral GitHub Actions job.
    # Never reuse a Render/staging/production DATABASE_URL or repository secret.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sendro_ci
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: sendro_ig_ci
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U sendro_ci -d sendro_ig_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SENDRO_INSTAGRAM_PG_CI_APPROVAL: ephemeral-local-service-only
      SENDRO_INSTAGRAM_PG_CI_URL: postgresql+psycopg://sendro_ci:disposable-ci-password@127.0.0.1:55439/sendro_ig_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt 'pytest>=8.0'
      - name: PostgreSQL only — Instagram synthetic delivery tests
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_postgres_isolation.py -q
      - name: PostgreSQL only — replay six pinned manual Instagram migrations
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_manual_migrations_postgres.py -q
      - name: PostgreSQL only — read-only Instagram schema drift audit
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_schema_audit_postgres.py -q
