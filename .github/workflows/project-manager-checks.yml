name: Project Manager checks

on:
  push:
    branches:
      - feature/sendro-project-manager
      - feature/workspace-task-hub
      - feature/webflow-ai-backlog-import
      - feature/unified-tabs-whatsapp-live
      - fix/webhook-delivery-hardening-phase1
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'

jobs:
  backend:
    name: Project API and role tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt 'httpx>=0.27' 'pytest>=8.0'
      - run: cd backend && PYTHONPATH=.. python -m pytest tests/test_project_manager.py tests/test_project_route_guard.py tests/test_task_hub.py tests/test_webflow_backlog_import.py tests/test_whatsapp_live_panel.py tests/test_whatsapp_webhook_hardening.py tests/test_whatsapp_account_routing_preflight.py tests/test_manual_index_rollout.py tests/test_instagram_webhook_handshake.py tests/test_instagram_event_normalizer.py tests/test_instagram_encrypted_inbox.py tests/test_instagram_delivery_worker.py tests/test_instagram_worker_control.py tests/test_instagram_inbox_read_api.py tests/test_instagram_synthetic_e2e.py tests/test_instagram_meta_payload_shapes.py tests/test_instagram_queue_reliability.py tests/test_instagram_live_readiness.py tests/test_instagram_pilot_evidence_preflight.py tests/test_instagram_watchdog_policy.py tests/test_instagram_staging_http_sentinel.py tests/test_privacy_retention.py tests/test_privacy_batch_delivery_retention.py tests/test_privacy_erasure_cases.py tests/test_privacy_case_api.py tests/test_privacy_readonly_preview.py -q

  frontend:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test src/unifiedInboxRows.test.js src/instagramIncidentRows.test.js
      - name: Build dormant Instagram Incident Center library separately without mounting it
        run: >-
          node --input-type=module -e "import { build } from 'vite';
          await build({ configFile: false, build: {
          outDir: '/tmp/sendro-ig-preview-check',
          lib: { entry: 'src/InstagramIncidentCenterPreview.jsx',
          formats: ['es'], fileName: 'incident-center' },
          rollupOptions: { external: ['react'] } } });"
      - run: npm run build

  instagram-postgres-integration:
    name: Instagram isolated PostgreSQL transaction tests
    runs-on: ubuntu-latest
    # The database exists only inside this ephemeral GitHub Actions job.
    # Never reuse a Render/staging/production DATABASE_URL or repository secret.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sendro_ci
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: sendro_ig_ci
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U sendro_ci -d sendro_ig_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SENDRO_INSTAGRAM_PG_CI_APPROVAL: ephemeral-local-service-only
      SENDRO_INSTAGRAM_PG_CI_URL: postgresql+psycopg://sendro_ci:disposable-ci-password@127.0.0.1:55439/sendro_ig_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt 'pytest>=8.0' 'httpx>=0.27'
      - name: PostgreSQL only — Instagram synthetic delivery tests
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_postgres_isolation.py -q
      - name: PostgreSQL only — replay six pinned manual Instagram migrations
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_manual_migrations_postgres.py -q
      - name: PostgreSQL only — read-only Instagram schema drift audit
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_schema_audit_postgres.py -q
      - name: PostgreSQL only — metadata-only dedicated read-only observer DB role
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_restricted_observer_postgres_ci.py -q
      - name: PostgreSQL only — signed Instagram HTTP to Inbox gated rehearsal
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_signed_http_postgres_e2e.py -q
      - name: PostgreSQL only — bounded gated Instagram supervisor rehearsal
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_postgres_supervision_ci.py -q
      - name: PostgreSQL only — durable redacted Instagram alert outbox CI rehearsal
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_alert_outbox_ci.py -q
      - name: PostgreSQL only — independent Instagram queue observer CI rehearsal
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_alert_observer_ci.py -q
      - name: PostgreSQL only — synthetic Instagram alert dispatch and acknowledgment
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_alert_dispatch_ci.py -q
      - name: PostgreSQL only — incident episode dedupe and responder ACL audit
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_alert_episodes_ack_ci.py -q
      - name: PostgreSQL only — unmounted in-app Incident Center, signed recent MFA, global responder ACL
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_incident_center_ci_api.py -q
      - name: PostgreSQL only — exact Sendro source auth functions against synthetic incident API
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_actual_sendro_auth_chain_ci.py -q
      - name: PostgreSQL only — signed DM to durable incident to reviewed alert full-loop
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_signed_dm_to_incident_full_loop_ci.py -q
      - name: PostgreSQL only — exact one-time failed Instagram DM recovery audit
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_failed_recovery_ci.py -q
      - name: PostgreSQL only — exact one-DM pilot delivery and account safety
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_instagram_single_dm_pilot_postgres.py -q
      - name: PostgreSQL only — synthetic privacy retention aggregate preview
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_privacy_retention_pg_preview.py -q
      - name: PostgreSQL only — GDPR case storage and append-only audit
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_privacy_case_postgres_ci.py -q

  whatsapp-ownership-postgres-rehearsal:
    name: WhatsApp isolated PostgreSQL ownership rehearsal
    runs-on: ubuntu-latest
    # Entirely separate disposable service from the Instagram CI job.
    # No DATABASE_URL, Render secrets, GitHub production DB, or real Meta traffic.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sendro_wa_ci
          POSTGRES_PASSWORD: disposable-whatsapp-ci-only
          POSTGRES_DB: sendro_wa_ci
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U sendro_wa_ci -d sendro_wa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SENDRO_WHATSAPP_PG_CI_APPROVAL: ephemeral-whatsapp-postgres-only
      SENDRO_WHATSAPP_PG_CI_URL: postgresql+psycopg://sendro_wa_ci:disposable-whatsapp-ci-only@127.0.0.1:55440/sendro_wa_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt 'pytest>=8.0' 'httpx>=0.27'
      - name: Replay exact manual WhatsApp mapping DDL and synthetic failures
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_privacy_whatsapp_ownership_postgres_ci.py -q
      - name: CI-only synthetic two-company WhatsApp ingress and outbound isolation
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_whatsapp_multitenant_postgres_ci.py -q
      - name: CI-only reviewed WhatsApp destination registry and immutable revocation
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_whatsapp_verified_destination_postgres_ci.py -q

  whatsapp-privileges-postgres-rehearsal:
    name: WhatsApp disposable PostgreSQL role separation
    runs-on: ubuntu-latest
    # Dedicated, ephemeral CI-only database; never shares service/port with
    # Render, WhatsApp staging, production, or other CI postgres jobs.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: sendro_wa_acl_ci
          POSTGRES_PASSWORD: ci-ephemeral-role-password-only
          POSTGRES_DB: sendro_wa_acl_ci
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U sendro_wa_acl_ci -d sendro_wa_acl_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SENDRO_WHATSAPP_ACL_PG_CI_APPROVAL: disposable-whatsapp-acl-postgres-only
      SENDRO_WHATSAPP_ACL_PG_CI_URL: postgresql+psycopg://sendro_wa_acl_ci:ci-ephemeral-role-password-only@127.0.0.1:55441/sendro_wa_acl_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt 'pytest>=8.0' 'httpx>=0.27'
      - name: Disposable PostgreSQL only — separate table owner, read, attest, revoke and deny DDL
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_whatsapp_destination_privileges_postgres_ci.py -q

  whatsapp-private-registry-postgres-rehearsal:
    name: WhatsApp empty private registry PostgreSQL 18.3
    runs-on: ubuntu-latest
    # A separate clean disposable service: NOT the existing public-registry job.
    # No live Render DB URL, Meta credentials or actual customer records.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: sendro_wa_private_ci
          POSTGRES_PASSWORD: disposable-private-whatsapp-ci
          POSTGRES_DB: sendro_wa_private_ci
        ports:
          - 55443:5432
        options: >-
          --health-cmd "pg_isready -U sendro_wa_private_ci -d sendro_wa_private_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SENDRO_WHATSAPP_PRIVATE_PG_CI_APPROVAL: disposable-private-whatsapp-postgres-only
      SENDRO_WHATSAPP_PRIVATE_PG_CI_URL: postgresql+psycopg://sendro_wa_private_ci:disposable-private-whatsapp-ci@127.0.0.1:55443/sendro_wa_private_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt 'pytest>=8.0' 'httpx>=0.27'
      - name: Private schema — fail atomic install, empty registry and unprivileged reader
        run: cd backend && PYTHONPATH=.. python -m pytest tests/test_whatsapp_dedicated_registry_postgres_ci.py -q
