name: Project Manager checks

on:
  push:
    branches:
      - feature/sendro-project-manager
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'

jobs:
  backend:
    name: Project API and role tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'fastapi>=0.115' 'sqlalchemy>=2.0' 'pydantic>=2.0' 'httpx>=0.27' 'pytest>=8.0' python-dotenv
      - run: python -m pytest backend/tests/test_project_manager.py -q

  frontend:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
