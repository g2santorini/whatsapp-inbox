name: Project Manager checks

on:
  push:
    branches:
      - feature/sendro-project-manager
      - feature/workspace-task-hub
      - feature/webflow-ai-backlog-import
      - feature/unified-tabs-whatsapp-live
      - fix/webhook-delivery-hardening-phase1
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'

jobs:
  backend:
    name: Project API and role tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt 'httpx>=0.27' 'pytest>=8.0'
      - run: cd backend && PYTHONPATH=.. python -m pytest tests/test_project_manager.py tests/test_project_route_guard.py tests/test_task_hub.py tests/test_webflow_backlog_import.py tests/test_whatsapp_live_panel.py tests/test_whatsapp_webhook_hardening.py tests/test_manual_index_rollout.py tests/test_instagram_webhook_handshake.py tests/test_instagram_event_normalizer.py tests/test_instagram_encrypted_inbox.py tests/test_instagram_delivery_worker.py tests/test_instagram_worker_control.py tests/test_instagram_inbox_read_api.py tests/test_instagram_synthetic_e2e.py tests/test_instagram_meta_payload_shapes.py -q

  frontend:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test src/unifiedInboxRows.test.js
      - run: npm run build
