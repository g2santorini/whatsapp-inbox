name: Project Manager checks

on:
  push:
    branches:
      - feature/sendro-project-manager
      - feature/workspace-task-hub
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'

jobs:
  backend:
    name: Project API and role tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt 'httpx>=0.27' 'pytest>=8.0'
      - run: cd backend && PYTHONPATH=.. python -m pytest tests/test_project_manager.py tests/test_project_route_guard.py tests/test_task_hub.py -q

  frontend:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
