name: Production project-only access guard

on:
  push:
    branches:
      - security/deny-project-only-production
  pull_request:
    paths:
      - 'backend/app/main.py'
      - 'backend/tests/test_production_project_only_deny.py'

jobs:
  test:
    name: Reject project-only messaging access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt 'pytest>=8.0' 'httpx>=0.27'
      - run: cd backend && PYTHONPATH=.. python -m pytest -q tests/test_production_project_only_deny.py
